services:
  sistemastocks:
    build: .
    container_name: sistemastocks
    restart: unless-stopped
    ports:
      # Solo loopback: el contenedor NO queda expuesto a Internet. El unico
      # punto de entrada debe ser el reverse proxy (Apache/nginx) del host.
      # Si alguna vez hace falta exponerlo, hacerlo con firewall de por medio.
      - "127.0.0.1:5000:5000"
    env_file:
      - /home/isantucci/srv/sistemastocks/env/.env
    volumes:
      - /home/isantucci/srv/sistemastocks/data:/data
      - /home/isantucci/srv/sistemastocks/backups:/backups
      - /home/isantucci/srv/sistemastocks/logs:/logs
